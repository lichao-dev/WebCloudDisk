<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">WebCloudDisk 系统总体架构</title>
  <desc id="description">浏览器通过 API Gateway 访问用户和文件 RPC 服务，Consul 提供注册发现，文件服务将本地文件作为主存储，并通过 RabbitMQ 和独立 Worker 异步备份到 OSS。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .box-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      .legend { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 1.5; filter: url(#shadow); }
      .sync { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .discovery { fill: none; stroke: #059669; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-green); }
      .async { fill: none; stroke: #d97706; stroke-width: 2.2; stroke-dasharray: 8 5; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1280" height="760" rx="18" fill="#f8fafc"/>
  <text class="title" x="40" y="48">WebCloudDisk 系统总体架构</text>
  <text class="subtitle" x="40" y="74">四个独立进程 · 本地内容寻址主存储 · RabbitMQ 异步 OSS 容灾备份</text>

  <rect class="card" x="35" y="280" width="150" height="100" rx="16" stroke="#94a3b8"/>
  <text class="box-title" x="110" y="316" text-anchor="middle">浏览器</text>
  <text class="box-text" x="110" y="343" text-anchor="middle">静态 Web 页面</text>
  <text class="box-text" x="110" y="364" text-anchor="middle">Bearer JWT / 文件</text>

  <rect class="card" x="235" y="225" width="215" height="205" rx="16" stroke="#3b82f6"/>
  <rect x="235" y="225" width="215" height="48" rx="16" fill="#dbeafe"/>
  <path d="M235 257 H450 V273 H235 Z" fill="#dbeafe"/>
  <text class="box-title" x="342.5" y="255" text-anchor="middle">API Gateway</text>
  <text class="box-text" x="342.5" y="294" text-anchor="middle">wfrest HTTP :9527</text>
  <text class="box-text" x="342.5" y="318" text-anchor="middle">静态资源与 REST API</text>
  <text class="box-text" x="342.5" y="342" text-anchor="middle">JWT 校验</text>
  <text class="box-text" x="342.5" y="366" text-anchor="middle">Consul 动态发现</text>
  <text class="box-text" x="342.5" y="390" text-anchor="middle">独立 User / File 轮询器</text>

  <rect class="card" x="525" y="120" width="215" height="145" rx="16" stroke="#8b5cf6"/>
  <rect x="525" y="120" width="215" height="46" rx="16" fill="#ede9fe"/>
  <path d="M525 150 H740 V166 H525 Z" fill="#ede9fe"/>
  <text class="box-title" x="632.5" y="149" text-anchor="middle">User RPC Service</text>
  <text class="box-text" x="632.5" y="190" text-anchor="middle">sRPC / Protobuf :9601</text>
  <text class="box-text" x="632.5" y="214" text-anchor="middle">注册、登录、用户查询</text>
  <text class="box-text" x="632.5" y="238" text-anchor="middle">PBKDF2 / JWT 签发</text>

  <rect class="card" x="525" y="340" width="215" height="185" rx="16" stroke="#0ea5e9"/>
  <rect x="525" y="340" width="215" height="46" rx="16" fill="#e0f2fe"/>
  <path d="M525 370 H740 V386 H525 Z" fill="#e0f2fe"/>
  <text class="box-title" x="632.5" y="369" text-anchor="middle">File RPC Service</text>
  <text class="box-text" x="632.5" y="410" text-anchor="middle">sRPC / Protobuf :9602</text>
  <text class="box-text" x="632.5" y="434" text-anchor="middle">列表、上传、下载</text>
  <text class="box-text" x="632.5" y="458" text-anchor="middle">SHA-256 内容寻址</text>
  <text class="box-text" x="632.5" y="482" text-anchor="middle">文件元数据持久化</text>
  <text class="box-text" x="632.5" y="506" text-anchor="middle">可选发布备份任务</text>

  <rect class="card" x="830" y="90" width="210" height="125" rx="16" stroke="#10b981"/>
  <rect x="830" y="90" width="210" height="43" rx="16" fill="#d1fae5"/>
  <path d="M830 118 H1040 V133 H830 Z" fill="#d1fae5"/>
  <text class="box-title" x="935" y="118" text-anchor="middle">Consul</text>
  <text class="box-text" x="935" y="157" text-anchor="middle">服务注册 / 注销</text>
  <text class="box-text" x="935" y="181" text-anchor="middle">TCP 健康检查</text>
  <text class="box-text" x="935" y="201" text-anchor="middle">仅发现 passing 实例</text>

  <rect class="card" x="830" y="260" width="210" height="95" rx="16" stroke="#64748b"/>
  <text class="box-title" x="935" y="293" text-anchor="middle">MySQL 8.0</text>
  <text class="box-text" x="935" y="320" text-anchor="middle">用户与文件元数据</text>
  <text class="box-text" x="935" y="341" text-anchor="middle">tbl_user / tbl_file</text>

  <rect class="card" x="830" y="395" width="210" height="105" rx="16" stroke="#0284c7"/>
  <text class="box-title" x="935" y="428" text-anchor="middle">本地文件系统</text>
  <text class="box-text" x="935" y="455" text-anchor="middle">主存储：root/&lt;sha256&gt;</text>
  <text class="box-text" x="935" y="478" text-anchor="middle">File Service / Worker 共享</text>

  <rect class="card" x="830" y="545" width="210" height="90" rx="16" stroke="#f59e0b"/>
  <text class="box-title" x="935" y="578" text-anchor="middle">RabbitMQ</text>
  <text class="box-text" x="935" y="603" text-anchor="middle">持久化队列与消息</text>
  <text class="box-text" x="935" y="623" text-anchor="middle">webdisk.oss.backup.v1</text>

  <rect class="card" x="1080" y="500" width="165" height="125" rx="16" stroke="#f59e0b"/>
  <rect x="1080" y="500" width="165" height="43" rx="16" fill="#fef3c7"/>
  <path d="M1080 528 H1245 V543 H1080 Z" fill="#fef3c7"/>
  <text class="box-title" x="1162.5" y="528" text-anchor="middle">Backup Worker</text>
  <text class="box-text" x="1162.5" y="568" text-anchor="middle">独立进程</text>
  <text class="box-text" x="1162.5" y="592" text-anchor="middle">读取本地内容</text>
  <text class="box-text" x="1162.5" y="614" text-anchor="middle">上传成功后 ACK</text>

  <rect class="card" x="1080" y="650" width="165" height="75" rx="16" stroke="#f97316"/>
  <text class="box-title" x="1162.5" y="680" text-anchor="middle">阿里云 OSS</text>
  <text class="box-text" x="1162.5" y="704" text-anchor="middle">容灾备份副本</text>

  <path class="sync" d="M185 330 H235"/>
  <text class="label" x="210" y="318" text-anchor="middle">HTTP</text>
  <path class="sync" d="M450 285 C480 285 490 192 525 192"/>
  <text class="label" x="487" y="226" text-anchor="middle">sRPC</text>
  <path class="sync" d="M450 365 C480 365 490 430 525 430"/>
  <text class="label" x="487" y="398" text-anchor="middle">sRPC</text>

  <path class="discovery" d="M400 225 C500 88 690 68 830 134"/>
  <text class="label" x="612" y="80" text-anchor="middle">每次请求查询 passing 实例</text>
  <path class="discovery" d="M740 160 C778 160 790 150 830 150"/>
  <path class="discovery" d="M740 375 C790 340 785 190 830 181"/>
  <text class="label" x="783" y="260" text-anchor="middle">注册 / 注销</text>

  <path class="sync" d="M740 205 C782 205 790 285 830 285"/>
  <path class="sync" d="M740 405 C782 405 788 330 830 330"/>
  <text class="label" x="785" y="315" text-anchor="middle">SQL</text>
  <path class="sync" d="M740 455 H830"/>
  <text class="label" x="785" y="444" text-anchor="middle">读写</text>

  <path class="async" d="M740 500 C780 500 790 590 830 590"/>
  <text class="label" x="787" y="544" text-anchor="middle">备份任务</text>
  <path class="async" d="M1040 590 H1080"/>
  <text class="label" x="1060" y="578" text-anchor="middle">消费</text>
  <path class="sync" d="M1080 550 C1055 520 1065 447 1040 447"/>
  <text class="label" x="1065" y="478" text-anchor="middle">读取</text>
  <path class="async" d="M1162 625 V650"/>
  <text class="label" x="1180" y="643">PutObject</text>

  <line x1="45" y1="706" x2="95" y2="706" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text class="legend" x="108" y="711">同步请求 / 数据访问</text>
  <line x1="270" y1="706" x2="320" y2="706" stroke="#059669" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-green)"/>
  <text class="legend" x="333" y="711">服务注册与发现</text>
  <line x1="500" y1="706" x2="550" y2="706" stroke="#d97706" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#arrow-orange)"/>
  <text class="legend" x="563" y="711">异步备份链路</text>
  <text class="legend" x="45" y="738">边界：API Gateway 不访问数据库、RabbitMQ 或 OSS；OSS 凭据只由 Backup Worker 持有。</text>
</svg>
