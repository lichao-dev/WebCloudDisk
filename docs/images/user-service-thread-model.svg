<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">User Service 线程模型</title>
  <desc id="description">展示 User Service 的主线程、Workflow 通信池、计算池、DNS 和日志刷新线程，以及注册和登录请求在 sRPC、PBKDF2 与 MySQL 阶段之间迁移。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2563eb"/></marker>
    <marker id="purple-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#7c3aed"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#059669"/></marker>
    <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .head { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .text { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .small { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; }
      .lane { stroke-width: 1.4; }
      .gray { fill: #f1f5f9; stroke: #94a3b8; }
      .blue { fill: #dbeafe; stroke: #60a5fa; }
      .cyan { fill: #e0f2fe; stroke: #38bdf8; }
      .purple { fill: #ede9fe; stroke: #a78bfa; }
      .green { fill: #dcfce7; stroke: #4ade80; }
      .external { fill: #fff; stroke: #94a3b8; stroke-width: 1.3; }
      .network { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#blue-arrow); }
      .dispatch { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 7 4; marker-end: url(#purple-arrow); }
      .dns { fill: none; stroke: #059669; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#green-arrow); }
      .control { fill: none; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 3 4; marker-end: url(#gray-arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" rx="18" fill="#f8fafc"/>
  <text class="title" x="36" y="44">User Service 线程模型</text>
  <text class="subtitle" x="36" y="69">基线 26 个线程；首次 PBKDF2 任务后 +C 个 Compute；需要主机名解析时再 +4 个 DNS</text>

  <rect class="external" x="35" y="160" width="130" height="70" rx="12"/>
  <text class="head" x="100" y="190" text-anchor="middle">API Gateway</text>
  <text class="text" x="100" y="213" text-anchor="middle">sRPC 请求</text>
  <rect class="external" x="35" y="330" width="130" height="70" rx="12"/>
  <text class="head" x="100" y="360" text-anchor="middle">Consul</text>
  <text class="text" x="100" y="383" text-anchor="middle">注册 / 注销</text>
  <rect class="external" x="35" y="500" width="130" height="70" rx="12"/>
  <text class="head" x="100" y="530" text-anchor="middle">MySQL</text>
  <text class="text" x="100" y="553" text-anchor="middle">用户与密码哈希</text>

  <rect class="lane gray" x="205" y="105" width="175" height="480" rx="15"/>
  <text class="head" x="292.5" y="137" text-anchor="middle">主线程 × 1</text>
  <rect x="230" y="170" width="125" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text class="text" x="292.5" y="198" text-anchor="middle">装配组件</text>
  <text class="text" x="292.5" y="221" text-anchor="middle">启动 sRPC Server</text>
  <text class="small" x="292.5" y="240" text-anchor="middle">随后注册 Consul</text>
  <rect x="230" y="295" width="125" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text class="text" x="292.5" y="323" text-anchor="middle">同步等待注册</text>
  <text class="text" x="292.5" y="346" text-anchor="middle">WaitGroup 等信号</text>
  <rect x="230" y="420" width="125" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text class="text" x="292.5" y="448" text-anchor="middle">同步等待注销</text>
  <text class="text" x="292.5" y="471" text-anchor="middle">停止 sRPC Server</text>
  <text class="small" x="292.5" y="555" text-anchor="middle">Consul I/O 仍由通信池执行</text>

  <rect class="lane blue" x="420" y="105" width="175" height="480" rx="15"/>
  <text class="head" x="507.5" y="137" text-anchor="middle">Poller × 4</text>
  <text class="small" x="507.5" y="158" text-anchor="middle">Workflow 通信池</text>
  <rect x="445" y="170" width="125" height="80" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text class="text" x="507.5" y="198" text-anchor="middle">sRPC accept/read</text>
  <text class="text" x="507.5" y="221" text-anchor="middle">write / 事件通知</text>
  <rect x="445" y="300" width="125" height="80" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text class="text" x="507.5" y="328" text-anchor="middle">Consul HTTP I/O</text>
  <text class="small" x="507.5" y="351" text-anchor="middle">启动 / 退出阶段</text>
  <rect x="445" y="430" width="125" height="80" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text class="text" x="507.5" y="458" text-anchor="middle">MySQL 网络 I/O</text>
  <text class="small" x="507.5" y="481" text-anchor="middle">SQL 在 MySQL 执行</text>

  <rect class="lane cyan" x="635" y="105" width="205" height="480" rx="15"/>
  <text class="head" x="737.5" y="137" text-anchor="middle">Handler × 20</text>
  <text class="small" x="737.5" y="158" text-anchor="middle">RPC 方法与完成回调</text>
  <rect x="660" y="170" width="155" height="95" rx="10" fill="#fff" stroke="#7dd3fc"/>
  <text class="text" x="737.5" y="198" text-anchor="middle">解析 sRPC 请求</text>
  <text class="text" x="737.5" y="221" text-anchor="middle">创建 TaskScheduler</text>
  <text class="small" x="737.5" y="244" text-anchor="middle">追加到请求 SeriesWork</text>
  <rect x="660" y="300" width="155" height="95" rx="10" fill="#fff" stroke="#7dd3fc"/>
  <text class="text" x="737.5" y="328" text-anchor="middle">MySQL 完成回调</text>
  <text class="text" x="737.5" y="351" text-anchor="middle">Result 转换 / 业务续接</text>
  <text class="small" x="737.5" y="374" text-anchor="middle">登录再投递 PBKDF2</text>
  <rect x="660" y="430" width="155" height="80" rx="10" fill="#fff" stroke="#7dd3fc"/>
  <text class="text" x="737.5" y="458" text-anchor="middle">填充 Protobuf 响应</text>
  <text class="small" x="737.5" y="481" text-anchor="middle">通知通信池写回</text>

  <rect class="lane purple" x="880" y="105" width="210" height="330" rx="15"/>
  <text class="head" x="985" y="137" text-anchor="middle">Compute × C（按需）</text>
  <text class="small" x="985" y="158" text-anchor="middle">命名队列 webdisk-rpc</text>
  <rect x="905" y="190" width="160" height="82" rx="10" fill="#fff" stroke="#c4b5fd"/>
  <text class="text" x="985" y="218" text-anchor="middle">注册：PBKDF2 哈希</text>
  <text class="small" x="985" y="243" text-anchor="middle">完成后追加 INSERT</text>
  <rect x="905" y="305" width="160" height="82" rx="10" fill="#fff" stroke="#c4b5fd"/>
  <text class="text" x="985" y="333" text-anchor="middle">登录：PBKDF2 验证</text>
  <text class="small" x="985" y="358" text-anchor="middle">必要时哈希升级</text>
  <text class="small" x="985" y="415" text-anchor="middle">队列任务可由 C 个线程并发执行</text>

  <rect class="lane green" x="880" y="465" width="210" height="120" rx="15"/>
  <text class="head" x="985" y="497" text-anchor="middle">DNS × 4（按需）</text>
  <text class="text" x="985" y="526" text-anchor="middle">解析 Consul / MySQL 主机名</text>
  <text class="small" x="985" y="551" text-anchor="middle">使用 IP 时可能不会创建</text>

  <rect class="lane gray" x="1130" y="105" width="115" height="480" rx="15"/>
  <text class="head" x="1187.5" y="137" text-anchor="middle">日志 × 1</text>
  <text class="text" x="1187.5" y="178" text-anchor="middle">每 3 秒</text>
  <text class="text" x="1187.5" y="200" text-anchor="middle">flush</text>
  <text class="small" x="1187.5" y="245" text-anchor="middle">日志写入发生</text>
  <text class="small" x="1187.5" y="265" text-anchor="middle">在调用者线程</text>

  <path class="network" d="M165 195 H445"/>
  <path class="network" d="M570 210 H660"/><text class="label" x="615" y="198" text-anchor="middle">RPC 回调</text>
  <path class="dispatch" d="M815 230 H905"/><text class="label" x="860" y="218" text-anchor="middle">注册</text>
  <path class="dispatch" d="M905 255 C850 255 850 330 815 330"/><text class="label" x="855" y="284" text-anchor="middle">追加 SQL</text>
  <path class="network" d="M660 347 C620 347 610 470 570 470"/>
  <path class="network" d="M445 470 C350 470 270 535 165 535"/>
  <path class="network" d="M445 488 C610 590 735 555 737 510"/><text class="label" x="600" y="575" text-anchor="middle">MySQL 完成回调</text>
  <path class="dispatch" d="M815 355 H905"/><text class="label" x="860" y="343" text-anchor="middle">登录验证</text>
  <path class="dispatch" d="M905 365 C860 430 840 455 815 468"/>
  <path class="network" d="M660 475 C610 475 610 225 570 225"/>
  <path class="control" d="M355 335 H445"/>
  <path class="control" d="M445 340 H165"/>
  <path class="dns" d="M880 525 C835 525 835 375 815 360"/>

  <rect x="35" y="620" width="1210" height="65" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <text class="head" x="60" y="647">典型登录迁移</text>
  <text class="text" x="180" y="647">Poller → Handler → Poller（查询 MySQL）→ Handler → webdisk-rpc / Compute（PBKDF2）→ Handler → Poller（sRPC 响应）</text>
  <text class="small" x="60" y="672">如果密码策略需要升级，Compute 完成后会再追加一次 MySQL 更新任务，然后才生成成功响应。</text>
</svg>
