<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title description">
  <title id="title">Backup Worker 线程模型</title>
  <desc id="description">展示 Backup Worker 由主线程同步消费 RabbitMQ、读取本地文件、上传 OSS 并确认消息，以及独立的 spdlog 周期刷新线程。</desc>
  <defs>
    <marker id="orange-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#d97706"/></marker>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2563eb"/></marker>
    <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#64748b"/></marker>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .head { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .text { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .small { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; }
      .process { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .main { fill: #ffedd5; stroke: #fb923c; stroke-width: 1.4; }
      .log { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.4; }
      .external { fill: #fff; stroke: #94a3b8; stroke-width: 1.3; }
      .blocking { fill: none; stroke: #d97706; stroke-width: 2.3; stroke-dasharray: 8 5; marker-end: url(#orange-arrow); }
      .data { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#blue-arrow); }
      .control { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 3 4; marker-end: url(#gray-arrow); }
    </style>
  </defs>
  <rect width="1280" height="650" rx="18" fill="#f8fafc"/>
  <text class="title" x="36" y="44">Backup Worker 线程模型</text>
  <text class="subtitle" x="36" y="69">项目代码明确创建 2 个线程：主线程 × 1 + spdlog 周期刷新线程 × 1；不创建 Workflow 线程池</text>

  <rect class="external" x="35" y="145" width="150" height="75" rx="12"/>
  <text class="head" x="110" y="176" text-anchor="middle">RabbitMQ</text>
  <text class="text" x="110" y="199" text-anchor="middle">消息 / ACK / REJECT</text>
  <rect class="external" x="35" y="305" width="150" height="75" rx="12"/>
  <text class="head" x="110" y="336" text-anchor="middle">本地文件系统</text>
  <text class="text" x="110" y="359" text-anchor="middle">root/&lt;sha256&gt;</text>
  <rect class="external" x="35" y="465" width="150" height="75" rx="12"/>
  <text class="head" x="110" y="496" text-anchor="middle">阿里云 OSS</text>
  <text class="text" x="110" y="519" text-anchor="middle">同步 PutObject</text>

  <rect class="process" x="235" y="105" width="825" height="480" rx="18"/>
  <rect x="235" y="105" width="825" height="50" rx="18" fill="#ffedd5"/>
  <path d="M235 137 H1060 V155 H235 Z" fill="#ffedd5"/>
  <text class="head" x="647.5" y="136" text-anchor="middle">cloud_disk_backup_worker 进程</text>

  <rect class="main" x="265" y="185" width="585" height="355" rx="15"/>
  <text class="head" x="557.5" y="218" text-anchor="middle">主线程 × 1：串行消费循环</text>
  <rect x="295" y="255" width="120" height="70" rx="10" fill="#fff" stroke="#fdba74"/>
  <text class="text" x="355" y="283" text-anchor="middle">1. 阻塞消费</text>
  <text class="small" x="355" y="305" text-anchor="middle">最多等待 1 秒</text>
  <rect x="455" y="255" width="120" height="70" rx="10" fill="#fff" stroke="#fdba74"/>
  <text class="text" x="515" y="283" text-anchor="middle">2. 解析任务</text>
  <text class="small" x="515" y="305" text-anchor="middle">校验版本 / hash</text>
  <rect x="615" y="255" width="120" height="70" rx="10" fill="#fff" stroke="#fdba74"/>
  <text class="text" x="675" y="283" text-anchor="middle">3. 检查本地</text>
  <text class="small" x="675" y="305" text-anchor="middle">路径 + 文件存在</text>
  <rect x="455" y="385" width="120" height="70" rx="10" fill="#fff" stroke="#fdba74"/>
  <text class="text" x="515" y="413" text-anchor="middle">5. 消息处置</text>
  <text class="small" x="515" y="435" text-anchor="middle">ACK / REJECT</text>
  <rect x="615" y="385" width="120" height="70" rx="10" fill="#fff" stroke="#fdba74"/>
  <text class="text" x="675" y="413" text-anchor="middle">4. 同步上传</text>
  <text class="small" x="675" y="435" text-anchor="middle">失败则未确认退出</text>
  <path class="blocking" d="M415 290 H455"/>
  <path class="blocking" d="M575 290 H615"/>
  <path class="blocking" d="M675 325 V385"/>
  <path class="blocking" d="M615 420 H575"/>
  <path class="control" d="M455 435 C355 510 290 440 325 325"/>
  <text class="label" x="350" y="490" text-anchor="middle">下一条消息</text>
  <text class="small" x="557.5" y="515" text-anchor="middle">没有请求并发：一条消息处理完成后才消费下一条</text>

  <rect class="log" x="885" y="185" width="145" height="355" rx="15"/>
  <text class="head" x="957.5" y="218" text-anchor="middle">日志刷新 × 1</text>
  <rect x="905" y="270" width="105" height="85" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text class="text" x="957.5" y="300" text-anchor="middle">每 3 秒</text>
  <text class="text" x="957.5" y="323" text-anchor="middle">flush sinks</text>
  <text class="small" x="957.5" y="400" text-anchor="middle">普通日志调用</text>
  <text class="small" x="957.5" y="421" text-anchor="middle">仍在主线程</text>
  <text class="small" x="957.5" y="465" text-anchor="middle">同步 logger</text>

  <rect class="external" x="1105" y="175" width="140" height="85" rx="12"/>
  <text class="head" x="1175" y="205" text-anchor="middle">SIGINT / SIGTERM</text>
  <text class="text" x="1175" y="229" text-anchor="middle">只设置停止标志</text>
  <text class="small" x="1175" y="249" text-anchor="middle">不是独立线程</text>
  <rect class="external" x="1105" y="350" width="140" height="110" rx="12"/>
  <text class="head" x="1175" y="380" text-anchor="middle">未计入</text>
  <text class="text" x="1175" y="405" text-anchor="middle">操作系统线程</text>
  <text class="text" x="1175" y="428" text-anchor="middle">SDK 内部辅助线程</text>
  <text class="small" x="1175" y="450" text-anchor="middle">需运行时核对</text>

  <path class="blocking" d="M185 182 C220 182 245 290 295 290"/>
  <path class="data" d="M185 342 C330 342 460 342 615 290"/>
  <path class="blocking" d="M615 420 C430 420 350 502 185 502"/>
  <path class="blocking" d="M455 420 C300 420 250 200 185 200"/>
  <path class="control" d="M1105 220 C1015 220 865 220 850 240"/>

  <rect x="35" y="600" width="1210" height="32" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text class="small" x="640" y="621" text-anchor="middle">停止信号到来时，主线程最迟在当前同步操作结束或 1 秒消费等待超时后观察到停止标志。</text>
</svg>
