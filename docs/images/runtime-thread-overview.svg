<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="940" viewBox="0 0 1480 940" role="img" aria-labelledby="title description">
  <title id="title">WebCloudDisk 运行时线程交互总览</title>
  <desc id="description">展示 API Gateway、User Service、File Service 和 Backup Worker 四个进程中的主线程、Workflow 通信线程池、计算线程池、DNS 线程池和日志刷新线程，以及请求在这些线程之间的迁移。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      .title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .process-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .lane-title { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .lane-text { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .small { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      .process { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .main-lane { fill: #f1f5f9; stroke: #94a3b8; }
      .poller-lane { fill: #dbeafe; stroke: #60a5fa; }
      .handler-lane { fill: #e0f2fe; stroke: #38bdf8; }
      .compute-lane { fill: #ede9fe; stroke: #a78bfa; }
      .dns-lane { fill: #dcfce7; stroke: #4ade80; }
      .log-lane { fill: #f8fafc; stroke: #cbd5e1; }
      .worker-lane { fill: #ffedd5; stroke: #fb923c; }
      .external { fill: #fff; stroke: #94a3b8; stroke-width: 1.3; }
      .network { fill: none; stroke: #2563eb; stroke-width: 2.1; marker-end: url(#arrow-blue); }
      .dispatch { fill: none; stroke: #7c3aed; stroke-width: 2.1; stroke-dasharray: 7 4; marker-end: url(#arrow-purple); }
      .backup { fill: none; stroke: #d97706; stroke-width: 2.2; stroke-dasharray: 8 5; marker-end: url(#arrow-orange); }
      .control { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 3 4; marker-end: url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1480" height="940" rx="18" fill="#f8fafc"/>
  <text class="title" x="38" y="45">WebCloudDisk 运行时线程交互总览</text>
  <text class="subtitle" x="38" y="70">C = 在线 CPU 数；Compute 与 DNS 按需创建；前三个进程各自拥有独立的 Workflow 全局池</text>

  <rect class="external" x="25" y="334" width="120" height="72" rx="13"/>
  <text class="lane-title" x="85" y="365" text-anchor="middle">浏览器</text>
  <text class="lane-text" x="85" y="387" text-anchor="middle">HTTP / 文件</text>

  <rect class="process" x="180" y="100" width="350" height="690" rx="18"/>
  <rect x="180" y="100" width="350" height="52" rx="18" fill="#dbeafe"/>
  <path d="M180 134 H530 V152 H180 Z" fill="#dbeafe"/>
  <text class="process-title" x="355" y="132" text-anchor="middle">API Gateway 进程</text>

  <rect class="main-lane" x="205" y="175" width="300" height="70" rx="11"/>
  <text class="lane-title" x="225" y="201">主线程 × 1</text>
  <text class="lane-text" x="225" y="223">启动 / WaitGroup / 停止</text>

  <rect class="poller-lane" x="205" y="275" width="135" height="115" rx="11"/>
  <text class="lane-title" x="272.5" y="304" text-anchor="middle">Poller × 4</text>
  <text class="lane-text" x="272.5" y="329" text-anchor="middle">HTTP / Consul</text>
  <text class="lane-text" x="272.5" y="350" text-anchor="middle">sRPC 网络事件</text>
  <text class="small" x="272.5" y="374" text-anchor="middle">非阻塞 I/O</text>

  <rect class="handler-lane" x="370" y="275" width="135" height="115" rx="11"/>
  <text class="lane-title" x="437.5" y="304" text-anchor="middle">Handler × 20</text>
  <text class="lane-text" x="437.5" y="329" text-anchor="middle">普通路由</text>
  <text class="lane-text" x="437.5" y="350" text-anchor="middle">网络完成回调</text>
  <text class="small" x="437.5" y="374" text-anchor="middle">推进 SeriesWork</text>

  <rect class="compute-lane" x="205" y="430" width="300" height="105" rx="11"/>
  <text class="lane-title" x="355" y="458" text-anchor="middle">Compute × C（按需）</text>
  <text class="lane-text" x="355" y="482" text-anchor="middle">命名队列 wfrest0 → 工作线程池</text>
  <text class="lane-text" x="355" y="505" text-anchor="middle">上传 JWT / multipart / Protobuf bytes</text>
  <text class="small" x="355" y="524" text-anchor="middle">队列 ID 不是线程编号，也不强制单线程</text>

  <rect class="dns-lane" x="205" y="570" width="145" height="80" rx="11"/>
  <text class="lane-title" x="277.5" y="599" text-anchor="middle">DNS × 4</text>
  <text class="lane-text" x="277.5" y="623" text-anchor="middle">按需解析主机名</text>
  <rect class="log-lane" x="370" y="570" width="135" height="80" rx="11"/>
  <text class="lane-title" x="437.5" y="599" text-anchor="middle">日志刷新 × 1</text>
  <text class="lane-text" x="437.5" y="623" text-anchor="middle">每 3 秒 flush</text>

  <rect x="205" y="685" width="300" height="70" rx="11" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="lane-title" x="355" y="712" text-anchor="middle">线程数</text>
  <text class="lane-text" x="355" y="735" text-anchor="middle">基线 26；Compute +C；DNS +4</text>

  <path class="network" d="M145 370 H205"/>
  <path class="network" d="M340 330 H370"/>
  <path class="dispatch" d="M438 390 C438 410 420 417 400 430"/>
  <path class="dispatch" d="M310 430 C292 415 285 405 285 390"/>
  <path class="control" d="M355 245 V270"/>

  <rect class="process" x="585" y="100" width="360" height="330" rx="18"/>
  <rect x="585" y="100" width="360" height="50" rx="18" fill="#ede9fe"/>
  <path d="M585 132 H945 V150 H585 Z" fill="#ede9fe"/>
  <text class="process-title" x="765" y="131" text-anchor="middle">User Service 进程</text>
  <rect class="main-lane" x="605" y="170" width="90" height="65" rx="10"/>
  <text class="lane-title" x="650" y="197" text-anchor="middle">主 × 1</text>
  <text class="small" x="650" y="217" text-anchor="middle">启停 / Consul</text>
  <rect class="poller-lane" x="715" y="170" width="95" height="65" rx="10"/>
  <text class="lane-title" x="762.5" y="197" text-anchor="middle">Poller × 4</text>
  <text class="small" x="762.5" y="217" text-anchor="middle">sRPC / MySQL</text>
  <rect class="handler-lane" x="830" y="170" width="95" height="65" rx="10"/>
  <text class="lane-title" x="877.5" y="197" text-anchor="middle">Handler × 20</text>
  <text class="small" x="877.5" y="217" text-anchor="middle">RPC / 回调</text>
  <rect class="compute-lane" x="605" y="260" width="205" height="80" rx="10"/>
  <text class="lane-title" x="707.5" y="287" text-anchor="middle">Compute × C（按需）</text>
  <text class="lane-text" x="707.5" y="310" text-anchor="middle">webdisk-rpc：PBKDF2</text>
  <text class="small" x="707.5" y="329" text-anchor="middle">注册哈希 / 登录验证</text>
  <rect class="dns-lane" x="830" y="260" width="95" height="80" rx="10"/>
  <text class="lane-title" x="877.5" y="287" text-anchor="middle">DNS × 4</text>
  <text class="small" x="877.5" y="309" text-anchor="middle">按需</text>
  <rect class="log-lane" x="605" y="365" width="320" height="43" rx="10"/>
  <text class="lane-text" x="765" y="392" text-anchor="middle">日志刷新 × 1　｜　基线 26；Compute +C；DNS +4</text>
  <path class="network" d="M810 202 H830"/>
  <path class="dispatch" d="M870 235 C855 275 828 298 810 300"/>
  <path class="dispatch" d="M705 260 C700 238 720 229 735 235"/>

  <rect class="process" x="585" y="460" width="360" height="430" rx="18"/>
  <rect x="585" y="460" width="360" height="50" rx="18" fill="#e0f2fe"/>
  <path d="M585 492 H945 V510 H585 Z" fill="#e0f2fe"/>
  <text class="process-title" x="765" y="491" text-anchor="middle">File Service 进程</text>
  <rect class="main-lane" x="605" y="530" width="90" height="65" rx="10"/>
  <text class="lane-title" x="650" y="557" text-anchor="middle">主 × 1</text>
  <text class="small" x="650" y="577" text-anchor="middle">启停 / Consul</text>
  <rect class="poller-lane" x="715" y="530" width="95" height="65" rx="10"/>
  <text class="lane-title" x="762.5" y="557" text-anchor="middle">Poller × 4</text>
  <text class="small" x="762.5" y="577" text-anchor="middle">sRPC / MySQL</text>
  <rect class="handler-lane" x="830" y="530" width="95" height="65" rx="10"/>
  <text class="lane-title" x="877.5" y="557" text-anchor="middle">Handler × 20</text>
  <text class="small" x="877.5" y="577" text-anchor="middle">RPC / 回调</text>
  <rect class="compute-lane" x="605" y="625" width="320" height="120" rx="10"/>
  <text class="lane-title" x="765" y="653" text-anchor="middle">Compute × C（按需） · webdisk-rpc</text>
  <text class="lane-text" x="765" y="678" text-anchor="middle">上传：SHA-256 → 同步写盘</text>
  <text class="lane-text" x="765" y="701" text-anchor="middle">元数据完成后：同步 BasicPublish + confirm</text>
  <text class="lane-text" x="765" y="724" text-anchor="middle">下载：同步读盘</text>
  <rect class="dns-lane" x="605" y="775" width="145" height="55" rx="10"/>
  <text class="lane-title" x="677.5" y="800" text-anchor="middle">DNS × 4（按需）</text>
  <rect class="log-lane" x="770" y="775" width="155" height="55" rx="10"/>
  <text class="lane-title" x="847.5" y="800" text-anchor="middle">日志刷新 × 1</text>
  <text class="lane-text" x="765" y="865" text-anchor="middle">基线 26；Compute +C；DNS +4</text>
  <path class="network" d="M810 562 H830"/>
  <path class="dispatch" d="M870 595 C870 615 850 625 830 625"/>
  <path class="dispatch" d="M700 625 C700 610 720 600 738 595"/>

  <rect class="external" x="1000" y="105" width="180" height="75" rx="12"/>
  <text class="lane-title" x="1090" y="135" text-anchor="middle">Consul</text>
  <text class="lane-text" x="1090" y="158" text-anchor="middle">注册 / 发现 / 注销</text>
  <rect class="external" x="1000" y="235" width="180" height="75" rx="12"/>
  <text class="lane-title" x="1090" y="265" text-anchor="middle">MySQL</text>
  <text class="lane-text" x="1090" y="288" text-anchor="middle">SQL 在服务端执行</text>
  <rect class="external" x="1000" y="500" width="180" height="75" rx="12"/>
  <text class="lane-title" x="1090" y="530" text-anchor="middle">RabbitMQ</text>
  <text class="lane-text" x="1090" y="553" text-anchor="middle">发布 / 消费 / ACK</text>
  <rect class="external" x="1000" y="640" width="180" height="75" rx="12"/>
  <text class="lane-title" x="1090" y="670" text-anchor="middle">本地文件</text>
  <text class="lane-text" x="1090" y="693" text-anchor="middle">主存储 / Worker 读取</text>
  <rect class="external" x="1275" y="795" width="165" height="70" rx="12"/>
  <text class="lane-title" x="1357.5" y="824" text-anchor="middle">阿里云 OSS</text>
  <text class="lane-text" x="1357.5" y="847" text-anchor="middle">同步 PutObject</text>

  <rect class="process" x="1230" y="470" width="225" height="275" rx="18"/>
  <rect x="1230" y="470" width="225" height="50" rx="18" fill="#ffedd5"/>
  <path d="M1230 502 H1455 V520 H1230 Z" fill="#ffedd5"/>
  <text class="process-title" x="1342.5" y="501" text-anchor="middle">Backup Worker</text>
  <rect class="worker-lane" x="1250" y="545" width="185" height="120" rx="11"/>
  <text class="lane-title" x="1342.5" y="573" text-anchor="middle">主线程 × 1</text>
  <text class="lane-text" x="1342.5" y="598" text-anchor="middle">阻塞消费（最多 1 秒）</text>
  <text class="lane-text" x="1342.5" y="620" text-anchor="middle">读本地 → 上传 OSS</text>
  <text class="lane-text" x="1342.5" y="642" text-anchor="middle">ACK / REJECT</text>
  <rect class="log-lane" x="1250" y="685" width="185" height="40" rx="10"/>
  <text class="lane-text" x="1342.5" y="710" text-anchor="middle">日志刷新 × 1　｜　合计 2</text>

  <path class="network" d="M530 310 C555 310 557 202 585 202"/>
  <text class="label" x="556" y="241" text-anchor="middle">sRPC</text>
  <path class="network" d="M530 355 C555 355 557 562 585 562"/>
  <text class="label" x="557" y="448" text-anchor="middle">sRPC</text>
  <path class="network" d="M945 202 C970 202 975 272 1000 272"/>
  <path class="network" d="M945 562 C970 562 975 288 1000 288"/>
  <text class="label" x="974" y="377" text-anchor="middle">MySQL 网络任务</text>
  <path class="control" d="M505 210 C700 70 860 70 1000 135"/>
  <path class="control" d="M945 180 C965 170 978 155 1000 150"/>
  <path class="control" d="M945 540 C970 505 970 180 1000 165"/>
  <text class="label" x="777" y="91" text-anchor="middle">Consul 任务也复用各进程通信池</text>
  <path class="backup" d="M925 700 C970 700 970 538 1000 538"/>
  <text class="label" x="972" y="629" text-anchor="middle">同步发布</text>
  <path class="backup" d="M1180 538 H1250"/>
  <text class="label" x="1215" y="526" text-anchor="middle">阻塞消费</text>
  <path class="network" d="M925 680 H1000"/>
  <path class="network" d="M1250 620 C1210 620 1210 677 1180 677"/>
  <path class="backup" d="M1342 665 V795"/>

  <line x1="35" y1="910" x2="80" y2="910" stroke="#2563eb" stroke-width="2.1" marker-end="url(#arrow-blue)"/>
  <text class="small" x="92" y="914">网络任务 / 回调链路</text>
  <line x1="250" y1="910" x2="295" y2="910" stroke="#7c3aed" stroke-width="2.1" stroke-dasharray="7 4" marker-end="url(#arrow-purple)"/>
  <text class="small" x="307" y="914">投递 Compute / 返回通信阶段</text>
  <line x1="575" y1="910" x2="620" y2="910" stroke="#d97706" stroke-width="2.1" stroke-dasharray="8 5" marker-end="url(#arrow-orange)"/>
  <text class="small" x="632" y="914">阻塞式备份链路</text>
  <text class="small" x="955" y="914">日志调用在调用者线程同步执行；单独线程仅负责每 3 秒周期 flush。</text>
</svg>
