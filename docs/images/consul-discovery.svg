<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title description">
  <title id="title">WebCloudDisk Consul 注册、健康检查与动态调用</title>
  <desc id="description">RPC 服务监听成功后注册为 critical，Consul 从 Docker 容器通过 TCP 检查宿主机端口并标记 passing；网关每次请求只发现 passing 实例并轮询选择，无实例时返回 503。</desc>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .panel-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-text { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; stroke-linejoin: round; }
      .step { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .card { fill: #fff; stroke-width: 1.5; filter: url(#shadow); }
      .green { fill: none; stroke: #059669; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .green-dashed { fill: none; stroke: #059669; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#arrow-green); }
      .blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .blue-dashed { fill: none; stroke: #2563eb; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-blue); }
      .red { fill: none; stroke: #dc2626; stroke-width: 2.2; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1280" height="760" rx="18" fill="#f8fafc"/>
  <text class="title" x="40" y="48">Consul 注册、健康检查与动态调用</text>
  <text class="subtitle" x="40" y="74">注册生命周期与每次 HTTP 请求的服务发现是两条独立链路</text>

  <rect x="30" y="100" width="590" height="610" rx="18" fill="#f0fdf4" stroke="#86efac"/>
  <text class="panel-title" x="55" y="135">A. RPC 服务生命周期</text>

  <rect x="55" y="165" width="540" height="250" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text class="box-text" x="75" y="190">宿主机</text>

  <rect class="card" x="85" y="215" width="205" height="145" rx="14" stroke="#8b5cf6"/>
  <text class="box-title" x="187.5" y="246" text-anchor="middle">User Service 实例</text>
  <text class="box-text" x="187.5" y="273" text-anchor="middle">先监听 :9601</text>
  <text class="box-text" x="187.5" y="297" text-anchor="middle">公布 127.0.0.1:9601</text>
  <text class="box-text" x="187.5" y="321" text-anchor="middle">停止前先注销</text>
  <rect x="115" y="333" width="145" height="22" rx="11" fill="#dcfce7"/>
  <text class="box-text" x="187.5" y="349" text-anchor="middle">webdisk-user-service</text>

  <rect class="card" x="355" y="215" width="205" height="145" rx="14" stroke="#0ea5e9"/>
  <text class="box-title" x="457.5" y="246" text-anchor="middle">File Service 实例</text>
  <text class="box-text" x="457.5" y="273" text-anchor="middle">先监听 :9602</text>
  <text class="box-text" x="457.5" y="297" text-anchor="middle">公布 127.0.0.1:9602</text>
  <text class="box-text" x="457.5" y="321" text-anchor="middle">停止前先注销</text>
  <rect x="385" y="333" width="145" height="22" rx="11" fill="#dbeafe"/>
  <text class="box-text" x="457.5" y="349" text-anchor="middle">webdisk-file-service</text>

  <rect x="95" y="460" width="460" height="185" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text class="box-text" x="115" y="486">Docker 容器</text>
  <rect class="card" x="180" y="505" width="290" height="105" rx="14" stroke="#10b981"/>
  <text class="box-title" x="325" y="536" text-anchor="middle">Consul Agent 2.0.3</text>
  <text class="box-text" x="325" y="561" text-anchor="middle">新实例初始状态：critical</text>
  <text class="box-text" x="325" y="584" text-anchor="middle">TCP 检查通过后：passing</text>

  <circle cx="74" cy="430" r="13" fill="#059669"/><text class="step" x="74" y="434" text-anchor="middle">1</text>
  <path class="green" d="M188 360 C188 425 235 445 270 505"/>
  <path class="green" d="M458 360 C458 425 415 445 380 505"/>
  <text class="label" x="325" y="437" text-anchor="middle">监听成功后注册；注册失败则停止服务</text>

  <circle cx="570" cy="430" r="13" fill="#059669"/><text class="step" x="570" y="434" text-anchor="middle">2</text>
  <path class="green-dashed" d="M245 505 C205 455 160 430 160 360"/>
  <path class="green-dashed" d="M405 505 C445 455 490 430 490 360"/>
  <text class="label" x="325" y="675" text-anchor="middle">TCP: host.docker.internal:9601 / :9602</text>
  <text class="box-text" x="325" y="697" text-anchor="middle">持续 critical 可自动注销；正常退出主动注销后再停止 RPC Server</text>

  <rect x="650" y="100" width="600" height="610" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="panel-title" x="675" y="135">B. Gateway 每次请求动态发现</text>

  <rect class="card" x="690" y="180" width="190" height="125" rx="14" stroke="#3b82f6"/>
  <text class="box-title" x="785" y="212" text-anchor="middle">API Gateway</text>
  <text class="box-text" x="785" y="239" text-anchor="middle">收到 HTTP 请求</text>
  <text class="box-text" x="785" y="263" text-anchor="middle">User / File 独立轮询序号</text>
  <text class="box-text" x="785" y="286" text-anchor="middle">按选中地址创建 sRPC</text>

  <rect class="card" x="1010" y="180" width="200" height="125" rx="14" stroke="#10b981"/>
  <text class="box-title" x="1110" y="212" text-anchor="middle">Consul Catalog</text>
  <text class="box-text" x="1110" y="239" text-anchor="middle">按逻辑服务名查询</text>
  <text class="box-text" x="1110" y="263" text-anchor="middle">passing=true</text>
  <text class="box-text" x="1110" y="286" text-anchor="middle">过滤 critical / 无效地址</text>

  <circle cx="900" cy="215" r="13" fill="#2563eb"/><text class="step" x="900" y="219" text-anchor="middle">3</text>
  <path class="blue" d="M880 225 H1010"/>
  <text class="label" x="945" y="214" text-anchor="middle">发现任务</text>
  <path class="blue-dashed" d="M1010 275 H880"/>
  <text class="label" x="945" y="294" text-anchor="middle">健康端点集合</text>

  <rect x="690" y="350" width="520" height="125" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="box-title" x="715" y="380">端点转换与选择</text>
  <rect x="715" y="399" width="140" height="48" rx="10" fill="#dbeafe"/>
  <text class="box-text" x="785" y="419" text-anchor="middle">按 instance_id</text>
  <text class="box-text" x="785" y="438" text-anchor="middle">稳定排序</text>
  <path class="blue" d="M855 423 H910"/>
  <rect x="910" y="399" width="135" height="48" rx="10" fill="#e0f2fe"/>
  <text class="box-text" x="977.5" y="419" text-anchor="middle">原子序号 % N</text>
  <text class="box-text" x="977.5" y="438" text-anchor="middle">简单轮询</text>
  <path class="blue" d="M1045 423 H1090"/>
  <rect x="1090" y="399" width="95" height="48" rx="10" fill="#dcfce7"/>
  <text class="box-text" x="1137.5" y="419" text-anchor="middle">选中</text>
  <text class="box-text" x="1137.5" y="438" text-anchor="middle">host:port</text>

  <circle cx="675" cy="415" r="13" fill="#2563eb"/><text class="step" x="675" y="419" text-anchor="middle">4</text>

  <rect class="card" x="690" y="525" width="230" height="105" rx="14" stroke="#2563eb"/>
  <text class="box-title" x="805" y="556" text-anchor="middle">存在健康实例</text>
  <text class="box-text" x="805" y="583" text-anchor="middle">创建本次 sRPC 任务</text>
  <text class="box-text" x="805" y="607" text-anchor="middle">追加到当前 HTTP SeriesWork</text>
  <path class="blue" d="M950 475 C950 505 805 495 805 525"/>

  <rect class="card" x="980" y="525" width="230" height="105" rx="14" stroke="#ef4444"/>
  <text class="box-title" x="1095" y="556" text-anchor="middle">没有健康实例</text>
  <text class="box-text" x="1095" y="583" text-anchor="middle">发现失败或集合为空</text>
  <text class="box-text" x="1095" y="607" text-anchor="middle">HTTP 503</text>
  <path class="red" d="M950 475 C950 505 1095 495 1095 525"/>

  <circle cx="950" cy="490" r="13" fill="#2563eb"/><text class="step" x="950" y="494" text-anchor="middle">5</text>
  <text class="box-text" x="950" y="672" text-anchor="middle">实例集合发生变化时，下一次请求重新查询并在最新集合中选择；Gateway 不缓存固定 RPC 地址。</text>
</svg>
